<div class="form-container">
  <h1>Cadastrar Novo Usuário</h1>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label for="name">Nome:</label>
      <input id="name" type="text" formControlName="name">
    </div>

    <div class="form-field">
      <label for="email">Email:</label>
      <input id="email" type="email" formControlName="email">
    </div>

    <div class="form-field">
      <label for="passkey">Senha (Passkey):</label>
      <input id="passkey" type="password" formControlName="passkey">
    </div>

    <button type="submit" [disabled]="!registerForm.valid">Cadastrar</button>
  </form>

  <a routerLink="/users" class="back-link">Voltar para a lista</a>
</div>
